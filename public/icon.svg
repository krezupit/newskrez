<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="100%" height="100%">
  <defs>
    <linearGradient id="nkBg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#08182B" />
      <stop offset="50%" stop-color="#102A43" />
      <stop offset="100%" stop-color="#0D4B5E" />
    </linearGradient>
    <linearGradient id="tealGlow" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#0D9488" />
      <stop offset="100%" stop-color="#14B8A6" />
    </linearGradient>
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="8" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>

  <!-- Base Squircle -->
  <rect x="16" y="16" width="480" height="480" rx="112" fill="url(#nkBg)" stroke="#14B8A6" stroke-width="12" stroke-opacity="0.6" />

  <!-- Background Globe Radial Grid -->
  <circle cx="256" cy="256" r="180" fill="none" stroke="#0D9488" stroke-width="12" stroke-opacity="0.35" />
  <ellipse cx="256" cy="256" rx="90" ry="180" fill="none" stroke="#0D9488" stroke-width="10" stroke-opacity="0.35" />
  <line x1="76" y1="256" x2="436" y2="256" stroke="#0D9488" stroke-width="10" stroke-opacity="0.35" />

  <!-- Core Pulse Waveform (ECG + Digital Frequency) -->
  <path
    d="M80 256 H170 L205 140 L260 372 L308 190 L336 256 H432"
    fill="none"
    stroke="#FFFFFF"
    stroke-width="32"
    stroke-linecap="round"
    stroke-linejoin="round"
    filter="url(#glow)"
  />

  <!-- Regulatory Alert Accent Node (Red) -->
  <circle cx="260" cy="372" r="28" fill="#DC2626" stroke="#FFFFFF" stroke-width="6" />

  <!-- Technology Intelligence Node (Teal) -->
  <circle cx="205" cy="140" r="26" fill="#14B8A6" stroke="#FFFFFF" stroke-width="6" />

  <!-- News Sentinel Signal (Amber Spark) -->
  <circle cx="308" cy="190" r="22" fill="#F59E0B" stroke="#FFFFFF" stroke-width="5" />
</svg>
